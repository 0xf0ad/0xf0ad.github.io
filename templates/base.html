<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ config.extra.title | default(value=config.title) }}{% endblock %}</title>
    <meta name="description" content="{% block description %}{{ config.description | default(value='') }}{% endblock %}">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0d0d0d">
    <meta name="color-scheme" content="dark">
    <link rel="preload" href="{{ get_url(path='fonts/FiraCode-Regular.woff2') }}" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="{{ get_url(path='fonts/FiraCode-Bold.woff2') }}" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ get_url(path='css/style.css', cachebust=true) }}">
    <link rel="stylesheet" href="{{ get_url(path='terminal-header.css', cachebust=true) }}">
</head>
<body class="term-os" data-theme="terminus">
    <div class="term-desktop">
        <div class="term-app-window">
            <div class="term-titlebar">
                <div class="term-dots">
                    <span class="term-dot term-dot--close"   title="close"></span>
                    <span class="term-dot term-dot--minimize" title="minimize"></span>
                    <span class="term-dot term-dot--maximize" title="maximize"></span>
                </div>
                <span class="term-title-text">0xf0ad@github.io — bash — 80×24</span>
                <span class="term-title-spacer"></span>
            </div>
            <div class="term-scroll" id="main">
                {% block header %}
                {% include "partials/header.html" %}
                {% endblock %}
                <main class="term-main">
                    {% block main %}{% endblock %}
                </main>
                <footer class="term-statusbar">
                    {% block footer %}
                    {% include "partials/footer.html" %}
                    {% endblock %}
                </footer>
            </div>
        </div>
    </div>
</body>
</html>
